plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.gradleup.shadow'
}

configurations { shade }

dependencies {
    // ################## Template Dependencies ##################
    minecraft group: 'com.mojang', name: 'minecraft', version: minecraft_version
    // Adds parchment mappings to the fabric module
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    // NOTE: In MC 26.1 and onwards fabric uses (implementation) instead of (modImplementation)
    modImplementation group: 'net.fabricmc', name: 'fabric-loader', version: fabric_loader_version
    modImplementation group: 'net.fabricmc.fabric-api', name: 'fabric-api', version: fabric_version
    // PaCo includes mixinextras so we have access to a newer version on older fabric-loader versions
    include group: 'io.github.llamalad7', name: 'mixinextras-fabric', version: mixinextras_version
    // Findbugs is required to have access to annotations (such as javax)
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'

    // ################## Included Dependencies ##################
    // exp4j (Expression Parsing)
    implementation group: 'net.objecthunter', name: 'exp4j', version: exp4j_version
    shade          group: 'net.objecthunter', name: 'exp4j', version: exp4j_version
    // glsl parser (Shader Patching)
    implementation group: 'local_slim', name: 'glsl_parser', version: glsl_parser_version
    shade          group: 'local_slim', name: 'glsl_parser', version: glsl_parser_version
    // glsl processor (Parsing GLSL Source Code To A Tree)
    implementation group: 'io.github.ocelot', name: 'glsl-processor', version: glsl_processor_version
    shade(group: 'io.github.ocelot', name: 'glsl-processor', version: glsl_processor_version) {
        exclude group: "org.ow2.asm"
    }
    // NightConfig (Config System)
    implementation group: 'com.electronwill.night-config', name: 'core', version: night_config_version // Core
    shade          group: 'com.electronwill.night-config', name: 'core', version: night_config_version
    implementation group: 'com.electronwill.night-config', name: 'toml', version: night_config_version // Toml
    shade          group: 'com.electronwill.night-config', name: 'toml', version: night_config_version

    // ############### Compatibility Dependencies ################
    // Title Screen Compatibility
    modCompileOnly "curse.maven:fancymenu-367706:7256727"           // FancyMenu
    modCompileOnly "curse.maven:aether-255308:6800393"              // The Aether
    modImplementation "curse.maven:catalogue-fabric-667377:4766089" // Catalogue
    compileOnly "a:OFShell:1.0"

    // ############ Debugging/Profiling Dependencies #############
    // Spark (Performance Monitoring)
    modRuntimeOnly "curse.maven:spark-361579:4738953" // Spark

    // ################### Tests Dependencies ####################
    // Mod Menu (PaCoScreen Tests)
    modCompileOnly "maven.modrinth:modmenu:7.2.2" // Mod Menu
    // My Mods (PaCoScreen Tests)
    modRuntimeOnly "curse.maven:swampier_swamps-687298:4580758" // Swampier Swamps
    // Required by Swampier Swamps
    modRuntimeOnly "curse.maven:cloth-config-348521:5729104" // Cloth Config
    // Render Mods To Test Shader Patcher
//  modRuntimeOnly "curse.maven:indium-459496:6237037"      // Indium
    modCompileOnly "curse.maven:sodium-394468:6260639"      // Sodium
    modCompileOnly "curse.maven:irisshaders-455508:6258195" // Iris
}

loom {
    // Automatically enables AccessWideners if the file exists
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // Obfuscated MC code still requires a refmap
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    // The (:fabric) run configurations
    runs {
        configureEach {
            setConfigName("Fabric ${it.name.capitalize()}") // Unified run config names across all loaders
            ideConfigGenerated(true)
            def dir = "runs/${it.name}"
            file(dir).mkdirs() // Ensures the directory exists before launch
            runDir(dir)
        }
        client { client() }
        server { server() }
    }
}

// Excludes the Forge specific AccessTransformer from Fabric resources
processResources { exclude 'META-INF/accesstransformer.cfg' }

// Used to set "remap = false" to "remap = true" for certain mixins (needed because on fabric they otherwise cause crashes)
// NOTE: This only swaps the first "remap = false" that is found (should be the one in the class annotation)
tasks.register('patchMixinSources') {
    ext {
        // Classes in which the first "remap = false" should be swapped to "true"
        mixinTargetClasses = [
            "com.github.andrew0030.pandora_core.modules.instancer.mixin.render.sodium.SodiumRendererMixin"
        ]
        // Packages in which all classes will get their first "remap = false" swapped to "true"
        mixinTargetPackages = []
    }
}

shadowJar {
    archiveClassifier.set('') // Output as the main jar (no classifier)
    configurations = [project.configurations.shade] // Limits shaded libs to what was specified by "shade"
    // Relocates packages to avoid conflicts
    relocate 'net.objecthunter', "${project.group}.shadowed.objecthunter"
    relocate 'io.github.ocelot', "${project.group}.shadowed.github.ocelot"
    relocate 'com.electronwill.nightconfig', "${project.group}.shadowed.electronwill.nightconfig"
    relocate 'tfc.glsl', "${project.group}.shadowed.tfc.glsl"
    // Minimizes specified projects
    // NOTE: By using include inside minimize, it functions like a whitelist
    minimize {
        include(dependency("io.github.ocelot:.*:.*"))
        include(dependency("local_slim:.*:.*"))
    }
}
// Makes sure that the remapJar task depends on the shadowJar task.
// This means that the shadow jar will be built before the remapJar task.
remapJar {
    dependsOn shadowJar
    // Explicitly tells the remapJar task to use the shadowed jar
    inputFile.set(tasks.named('shadowJar', Jar).flatMap { it.archiveFile })
}

// Implement mcgradleconventions loader attribute (variant-aware resolution)
// Tags configs with loader='fabric' to ensure fabric-specific dependency resolution
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
configurations.matching {
    it.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath']
}.configureEach {
    attributes.attribute(loaderAttribute, 'fabric')
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Takes the files from the common module and replaces the "remap = false" attribute of the specified classes
// NOTE: This ONLY replaces the first found "remap = false" with "remap = true"
patchMixinSources {
    def commonSrcDirs = (project(':common').sourceSets.main.java.srcDirs as Set<File>).findAll { it.exists() }
    def outputDir = layout.buildDirectory.dir('generated/mixin-patched')
    // Specifies inputs and outputs for gradle's incremental build tracking (skips building if no changes occurred)
    commonSrcDirs.each { inputs.dir(it) }
    outputs.dir(outputDir)

    doLast {
        // Clears and recreates the output folder to ensure no stale files remain
        project.delete(outputDir)
        outputDir.get().asFile.mkdirs()
        // Creates a list of normalized target paths
        def targetPaths = ext.mixinTargetClasses.collect { it.replace('.', '/') + ".java" } + ext.mixinTargetPackages.collect { it.replace('.', '/') }

        commonSrcDirs.each { srcDir ->
            srcDir.eachFileRecurse { file ->
                // Only java files can be mixins so anything else can be skipped
                if (!file.name.endsWith('.java')) return
                // Grabs the file's relative path to the current source folder
                def relativePath = srcDir.toPath().relativize(file.toPath())
                def relativePathStr = relativePath.toString().replace('\\', '/')
                // Checks if the file matches any any of the targets
                if (targetPaths.any { relativePathStr == it || relativePathStr.startsWith("${it}/") }) {
                    // Finds the first "remap = false" in the file, patches it to "true", and writes the patched file to the output folder
                    def content = file.text.replaceFirst(/remap\s*=\s*false/, 'remap = true')
                    def outputFile = outputDir.get().asFile.toPath().resolve(relativePath).toFile()
                    outputFile.parentFile.mkdirs()
                    outputFile.text = content
                    println "\u001B[32m[PaCo/SourcePatch]\u001B[0m Patched 'remap' attribute in: \u001B[36m${relativePathStr}\u001B[0m"
                }
            }
        }
    }
}
tasks.named('compileJava', JavaCompile) {
    dependsOn patchMixinSources // Makes "compileJava" run after "patchMixinSources" so we can ensure all patches are done
    def commonSrcDirs = (project(':common').sourceSets.main.java.srcDirs as Set<File>).findAll { it.exists() }
    def patchTask = tasks.named('patchMixinSources').get()
    def outputDir = patchTask.outputs.files.singleFile

    // Creates a copy of the original sources, with all the patched files excluded
    def filteredSource = source.filter { File file ->
        // Early skip for all files that arent from any of the common source sets
        if (!commonSrcDirs.any { file.toPath().startsWith(it.toPath()) }) return true
        // If a patched version of the file exists in the output folder, the file is excluded from "filteredSource"
        return !commonSrcDirs.any { srcDir ->
            if (file.toPath().startsWith(srcDir.toPath())) {
                def relPath = srcDir.toPath().relativize(file.toPath())
                return new File(outputDir, relPath.toString()).exists()
            }
            return false
        }
    }
    setSource(filteredSource)       // Replaces the original sources with the filtered ones
    source(patchTask.outputs.files) // Adds the patched files as a source
}